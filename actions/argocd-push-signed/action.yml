name: ArgoCD Push (signed)
description: |
  Commits and pushes ArgoCD/kustomize changes back to a ruleset-protected
  branch. Mints a GitHub App installation token and commits via the GraphQL
  API, so GitHub signs the commit server-side (required by rulesets that
  demand signed commits) and it is authored by the App.
inputs:
  app_id:
    description: GitHub App ID (org secret, e.g. ARGOCD_PUSHER_APP_ID)
    required: true
  private_key:
    description: GitHub App private key (org secret, e.g. ARGOCD_PUSHER_PRIVATE_KEY)
    required: true
  branch:
    description: Branch to push to
    required: true
    default: ${{ github.ref_name }}
  commit_message:
    description: Commit message
    required: true
    default: update kustomize image tags
runs:
  using: composite
  steps:
    - name: Mint App token
      id: token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
    - name: Commit via API (signed by GitHub)
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        BRANCH: ${{ inputs.branch }}
        MSG: ${{ inputs.commit_message }}
      run: |
        set -euo pipefail
        git add -A
        # ponytail: no-op guard so a rerun with nothing to commit doesn't fail the job
        if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi

        adds=$(git diff --cached --name-only --diff-filter=d \
          | while read -r f; do
              jq -n --arg p "$f" --arg c "$(base64 -w0 "$f")" '{path:$p,contents:$c}'
            done | jq -sc .)
        dels=$(git diff --cached --name-only --diff-filter=D | jq -Rsc 'split("\n")|map(select(length>0)|{path:.})')

        jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$BRANCH" \
              --arg oid "$(git rev-parse HEAD)" --arg msg "$MSG" \
              --argjson a "$adds" --argjson d "$dels" '{
          query: "mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
          variables: {input: {
            branch: {repositoryNameWithOwner:$repo, branchName:$branch},
            expectedHeadOid: $oid,
            message: {headline:$msg},
            fileChanges: {additions:$a, deletions:$d}
          }}
        }' | gh api graphql --input -
